name: Mantener Render despierto

# Render (plan gratuito) apaga el servicio tras ~15 minutos sin visitas.
# Este ping cada 10 minutos evita que la primera visita tarde cerca de un minuto.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping al estado de la aplicación
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 20 https://puce2.onrender.com/health
